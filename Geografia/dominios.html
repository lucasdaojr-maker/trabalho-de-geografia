<html>
<head>
	<title>links</title>
</head>
<style>
	body {
    overflow: hidden;
	display: flex;                
    flex-direction: row;
	align-items: center;
	margin: 0;
	justify-content: space-around;
	background-color: rgb(104, 62, 0);
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
	padding: 0%;
	}

	a, h4 {
    display: flex;
    align-items: center;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    text-shadow: 10px;
    color: white;
    text-transform: uppercase;
    text-decoration: none;
    position: relative;
    padding-bottom: 4px;
    transition: color 0.3s ease,
                transform 0.2s ease,
                text-shadow 0.3s ease;
}

	a:hover {
        color: #ffeb3b;          /* Deixa o texto amarelo */

        /* Cria um brilho no texto */
        text-shadow: 0 0 10px rgba(255, 235, 59, 0.6);

        /* Faz o texto subir 3px */
        transform: translateY(-3px);
    }


    /* Cria a linha embaixo dos links */
    a::after {
        content: '';

        position: absolute;

        width: 0;                /* Começa sem largura */
        height: 3px;             /* Grossura da linha */

        bottom: 0;               /* Coloca a linha embaixo */
        left: 50%;               /* Posiciona no centro */

        /* Centraliza a linha */
        transform: translateX(-50%);

        background-color: #ffeb3b;
        border-radius: 2px;

        /* Faz a linha crescer suavemente */
        transition: width 0.35s ease;
    }


    /* Faz a linha aparecer ao passar o mouse */
    a:hover::after {
        width: 100%;
    }

</style>
