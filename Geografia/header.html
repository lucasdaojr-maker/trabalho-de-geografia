<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Geographic Prado</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgb(30, 130, 60), rgb(15, 75, 30));
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        img {
            height: 100vh;
            max-width: 100%;
            object-fit: contain;
            transition: transform 0.5s ease;
        }

        img:hover {
            transform: scale(1.15);
        }
    </style>
</head>
<body>
    <a href="introducao.html" target="resto">
        <img src="geoPrado.png" alt="Geographic Prado">
    </a>
</body>
</html>
